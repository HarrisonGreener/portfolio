<title>Instant Hire scratch layer</title>
<style>
/* Print this on the scratch-off sheet. One panel is 38 x 37.2 mm: the window it covers plus 0.35 mm all round,

@page{size:38mm 37.2mm;margin:0}
*{box-sizing:border-box}
body{margin:0;font-family:'Archivo','Inter','Helvetica Neue',Arial,sans-serif}

.pat i{font-style:normal;font-size:2mm;font-weight:900}
.box{position:relative;margin:.55mm;border:.3mm solid #141414;border-radius:.6mm;display:grid;grid-template-columns:6.6mm 1fr;align-items:center}
.n{width:4.4mm;height:4.4mm;margin-left:1.2mm;border-radius:50%;background:#141414;color:#fff;display:grid;place-items:center;font-size:2.6mm;font-weight:900}
.lab{justify-self:center;margin-right:3mm;text-align:center;line-height:1}
.lab b{display:block;font-size:3.1mm;font-weight:900;letter-spacing:-.01em;text-transform:uppercase;color:#E3001B}
.lab i{display:block;font-style:normal;font-size:1.35mm;font-weight:800;letter-spacing:.12em;margin-top:.5mm;color:#141414}
</style></head><body>
