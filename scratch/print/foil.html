<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Instant Hire scratch layer</title>
<style>
/* Print this on the scratch-off sheet. One panel is 38 x 37.2 mm: the window it covers plus 0.35 mm all round.
   Dark ink only, so the silver of the sheet shows through everywhere else. */
@page{size:38mm 37.2mm;margin:0}
*{box-sizing:border-box}
body{margin:0;font-family:'Archivo','Inter','Helvetica Neue',Arial,sans-serif}
.foil{width:38mm;height:37.2mm;position:relative;overflow:hidden;background:var(--bg,transparent);-webkit-print-color-adjust:exact;print-color-adjust:exact;page-break-after:always}
.pat{position:absolute;inset:-10mm;transform:rotate(-20deg);display:grid;grid-template-columns:repeat(9,6.2mm);grid-auto-rows:5.2mm;place-items:center;color:rgba(20,20,20,.28);font-weight:900;font-size:3mm}
.pat span:nth-child(odd){font-size:2.2mm}
.edge{position:absolute;inset:1mm;border:.3mm dashed rgba(20,20,20,.45)}
.label{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-4deg);background:var(--lab,#fff);border:.45mm solid #141414;padding:1.6mm 2.4mm 1.4mm;text-align:center;box-shadow:.6mm .6mm 0 #141414}
.label b{display:block;font-size:4.6mm;font-weight:900;line-height:.9;letter-spacing:-.01em;text-transform:uppercase;color:#E3001B}
.label i{display:block;font-style:normal;font-size:1.7mm;font-weight:800;letter-spacing:.1em;margin-top:.9mm;color:#141414}
.coin{position:absolute;right:3mm;bottom:3mm;width:6mm;height:6mm;border-radius:50%;border:.35mm solid #141414;display:grid;place-items:center;font-size:2.2mm;font-weight:900;color:#141414;transform:rotate(-12deg)}
.arrow{position:absolute;left:3mm;top:3mm;font-size:2.4mm;font-weight:900;color:#141414;transform:rotate(-12deg)}
</style></head><body>
<div class="foil"><div class="pat" id="pat"></div><div class="edge"></div>
  <div class="label"><b>Scratch<br>here</b><i>WHY HIRE ME?</i></div>
  <div class="arrow">★ ★ ★</div><div class="coin">£1</div>
</div>
<script>
document.getElementById('pat').innerHTML = Array.from({ length: 140 }, (_, i) => `<span>${i % 2 ? '★' : 'G'}</span>`).join('');
</script>
</body></html>
