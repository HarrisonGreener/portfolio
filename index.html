<title>Wallet CV</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: full-bleed 3D tabletop; quiet HUD pinned to the corners; an item sheet slides in when something is pulled out. */
:root{
  --table:#e6d3ba;
  --paper:#fbf8f3;
  --ink:#1c1915;
  --ink-soft:#6a5f55;
  --line:rgba(28,25,21,.14);
  --accent:#2a43c4;
  --display:'Bricolage Grotesque','Helvetica Neue',Arial,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--table);color:var(--ink);font-family:var(--display);overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#stage{position:fixed;inset:0}
#stage canvas{display:block;touch-action:none;outline:none}
.vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(120% 90% at 50% 45%,transparent 55%,rgba(60,40,20,.18) 100%)}

.brand{position:fixed;z-index:3;top:calc(env(safe-area-inset-top,0px) + 20px);left:calc(max(16px,env(safe-area-inset-left,0px)) + 8px);pointer-events:none}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft)}
.brand h1{margin:6px 0 0;font-size:clamp(22px,3.2vw,30px);font-weight:700;letter-spacing:-.01em;line-height:1.05}
.brand p{margin:4px 0 0;font-size:14px;color:var(--ink-soft)}

.hint{position:fixed;z-index:3;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 86px);
  font-family:var(--mono);font-size:12px;letter-spacing:.04em;color:var(--ink);background:rgba(251,248,243,.82);
  border:1px solid var(--line);padding:8px 14px;border-radius:999px;white-space:nowrap;pointer-events:none;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:opacity .3s}

.bar{position:fixed;z-index:3;left:0;right:0;bottom:0;display:flex;gap:12px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;
  padding-left:calc(max(16px,env(safe-area-inset-left,0px)) + 8px);padding-right:calc(max(16px,env(safe-area-inset-right,0px)) + 8px);
  padding-block:0 calc(env(safe-area-inset-bottom,0px) + 20px);pointer-events:none}
.inventory{display:flex;flex-wrap:wrap;gap:6px;align-items:center;pointer-events:auto;min-width:0}
.inventory .label{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);margin-right:4px}
.controls{display:flex;gap:8px;pointer-events:auto}
.btn{font-family:var(--mono);font-size:12px;font-weight:500;letter-spacing:.05em;color:var(--ink);background:var(--paper);
  border:1px solid var(--line);border-radius:999px;padding:9px 14px;cursor:pointer;transition:background .2s,transform .15s}
.btn:hover{background:#fff}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.primary:hover{background:#000}
.chip{padding:7px 11px;font-size:11.5px}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}

.sheet{position:fixed;z-index:4;right:calc(max(16px,env(safe-area-inset-right,0px)) + 12px);top:50%;width:min(340px,calc(100vw - 48px));
  transform:translate(16px,-50%);opacity:0;pointer-events:none;background:var(--paper);border:1px solid var(--line);border-radius:18px;
  padding:22px 22px 18px;box-shadow:0 24px 60px -24px rgba(20,14,8,.45);transition:opacity .35s,transform .35s;display:flex;flex-direction:column;gap:14px}
.sheet.open{opacity:1;transform:translate(0,-50%);pointer-events:auto}
.sheet h2{margin:0;font-size:26px;line-height:1.1;letter-spacing:-.01em;text-wrap:balance}
.sheet .body{margin:0;font-size:15px;line-height:1.5;color:var(--ink);max-width:60ch}
.facts{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13.5px;border-top:1px solid var(--line);padding-top:12px}
.facts dt{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);padding-top:2px}
.facts dd{margin:0;min-width:0}
.note{font-family:var(--mono);font-size:11px;color:var(--ink-soft);margin:0}
.sheet .actions{display:flex;gap:8px;flex-wrap:wrap}

.veil{position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:var(--table);transition:opacity .6s}
.veil.gone{opacity:0;pointer-events:none}
.veil p{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);text-align:center;max-width:40ch;line-height:1.6}

@media (max-width:720px){
  .hint{bottom:auto;top:calc(env(safe-area-inset-top,0px) + 96px);font-size:11px}
  .sheet{top:auto;bottom:0;left:0;right:0;width:auto;border-radius:18px 18px 0 0;max-height:46vh;overflow:auto;
    transform:translateY(24px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 18px);
    padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
  .sheet.open{transform:translateY(0)}
  .inventory .label{display:none}
  .bar{flex-direction:column;align-items:stretch}
  .inventory{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .inventory .chip{flex:none}
  .controls{justify-content:flex-end}
}
@media (prefers-reduced-motion:reduce){ .sheet,.hint,.veil{transition:none} }
</style>

<div id="stage" aria-label="Interactive 3D wallet. Use the buttons below to open it and pull out each item."></div>
<div class="vignette"></div>

<header class="brand">
  <div class="eyebrow">Wallet CV · prototype</div>
  <h1>Harrison Greener</h1>
  <p>Designer · graphic, web, UX/UI</p>
</header>

<div class="hint" id="hint" role="status">Click the wallet to open it</div>

<div class="bar">
  <nav class="inventory" id="inventory" aria-label="Items in the wallet"><span class="label">Inside</span></nav>
  <div class="controls">
    <button class="btn" id="resetBtn" type="button">Reset view</button>
    <button class="btn primary" id="openBtn" type="button">Open wallet</button>
  </div>
</div>

<aside class="sheet" id="sheet" aria-live="polite" aria-hidden="true">
  <div class="eyebrow" id="sheetEyebrow"></div>
  <h2 id="sheetTitle"></h2>
  <p class="body" id="sheetBody"></p>
  <dl class="facts" id="sheetFacts"></dl>
  <p class="note" id="sheetNote"></p>
  <div class="actions">
    <button class="btn primary" id="flipBtn" type="button">Flip it over</button>
    <button class="btn" id="backBtn" type="button">Put it back</button>
  </div>
</aside>

<div class="veil" id="veil"><p id="veilText">Unpacking the wallet…</p></div>

<script>
  // If the 3D library never arrives, say so instead of leaving a blank veil.
  window.__walletReady = false;
  setTimeout(() => { if (!window.__walletReady) { const t = document.getElementById('veilText'); if (t) t.textContent = 'The 3D view could not load. Check your connection and refresh the page.'; } }, 15000);
</script>

/* ---------- Renderer, scene, camera ---------- */
const stage = $('#stage');

function fitCamera() {

  const needW = 24 / (2 * Math.tan(halfFov) * camera.aspect);
  const needH = 17 / (2 * Math.tan(halfFov));
  const d = Math.max(34, needW, needH);

scene.add(new THREE.HemisphereLight(0xffffff, 0xcdb393, 0.7));

sun.position.set(-14, 30, -12);

scene.add(sun);

/* ---------- Procedural textures ---------- */
function noiseCanvas(size, layers, base = 128) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d');

    const sg = s.getContext('2d'); const img = sg.createImageData(cells, cells);
    for (let i = 0; i < img.data.length; i += 4) { const v = (Math.random() * 255) | 0; img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255; }

function tex(canvas, { srgb = true, repeat = 0 } = {}) {

// Leather: matte black with a fine pebble grain (round pebbles, not a woven noise) driving bump and roughness.
function pebbleCanvas(size) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d');
  g.fillStyle = 'rgb(128,128,128)'; g.fillRect(0, 0, size, size);
  const n = Math.round(size * size / 55);
  for (let i = 0; i < n; i++) {
    const x = Math.random() * size, y = Math.random() * size, r = 2.5 + Math.random() * 3.5;
    const v = (105 + Math.random() * 70) | 0;
    g.fillStyle = `rgb(${v},${v},${v})`; g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();

  const out = document.createElement('canvas'); out.width = out.height = size;
  const o = out.getContext('2d'); o.filter = 'blur(1px)'; o.drawImage(c, 0, 0);
  return out;

const leatherGrain = pebbleCanvas(2048);
const LEATHER_REPEAT = 1 / 20; // UVs are in cm; one tile covers 20 cm, so no seams show on the panels.
const leatherMat = new THREE.MeshPhysicalMaterial({
  color: 0x0f0f10,
  bumpMap: tex(leatherGrain, { srgb: false, repeat: LEATHER_REPEAT }), bumpScale: 0.15,
  roughnessMap: tex(leatherGrain, { srgb: false, repeat: LEATHER_REPEAT }), roughness: 1.5,
  sheen: 0.35, sheenColor: new THREE.Color(0x1c1c1e), sheenRoughness: 0.7, envMapIntensity: 0.35,

const stitchMat = new THREE.MeshStandardMaterial({ color: 0x1b1b1c, roughness: 0.7 });

// Table: warm linen, matched to the product photos.
const tableCanvas = document.createElement('canvas'); tableCanvas.width = tableCanvas.height = 512;
{ const g = tableCanvas.getContext('2d'); g.fillStyle = '#e6d3ba'; g.fillRect(0, 0, 512, 512); g.globalAlpha = 0.07; g.drawImage(noiseCanvas(512, [[32, 1], [256, 1]]), 0, 0); }
const ground = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.MeshStandardMaterial({ map: tex(tableCanvas, { repeat: 24 }), roughness: 1 }));

/* ---------- Geometry helpers ---------- */
// Rounded rectangle with per-corner radii [bottom-left, bottom-right, top-right, top-left] in shape space.
function rr(x0, y0, x1, y1, r, PathType = THREE.Shape) {
  const [bl, br, tr, tl] = Array.isArray(r) ? r : [r, r, r, r];
  const s = new PathType();
  s.moveTo(x0 + bl, y0);
  s.lineTo(x1 - br, y0); if (br) s.absarc(x1 - br, y0 + br, br, -Math.PI / 2, 0, false);
  s.lineTo(x1, y1 - tr); if (tr) s.absarc(x1 - tr, y1 - tr, tr, 0, Math.PI / 2, false);
  s.lineTo(x0 + tl, y1); if (tl) s.absarc(x0 + tl, y1 - tl, tl, Math.PI / 2, Math.PI, false);

// A flat leather piece lying on the table: shape x → world x, shape y → world -z, thickness → world y.
function slab(shape, thick, y0, mats = [leatherMat, edgeMat]) {

  const bev = Math.min(0.06, thick * 0.45);
  const g = new THREE.ExtrudeGeometry(shape, { depth: Math.max(thick - 2 * bev, 0.002), bevelEnabled: true, bevelThickness: bev, bevelSize: bev, bevelOffset: -bev, bevelSegments: 5, curveSegments: 28 });

// Saddle-style stitch run along an inset outline, on the top or bottom face of a panel.

function stitches(shape, yAt, flip = false) {
  const len = shape.getLength(); const n = Math.max(8, Math.round(len / 0.12));
  const pts = shape.getSpacedPoints(n);
  const count = Math.floor(pts.length / 2);
  const mesh = new THREE.InstancedMesh(new THREE.BoxGeometry(0.085, 0.012, 0.018), stitchMat, count);
  const d = new THREE.Object3D(); let k = 0;

/* ---------- Placeholder artwork (drawn until the real files arrive) ---------- */
function artCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return [c, c.getContext('2d')]; }

    g.font = `600 44px ${F.m}`; g.fillText('HARRISON GREENER', 70, 110);
    g.font = `400 26px ${F.m}`; g.fillText('DESIGN \u00b7 MANCHESTER / BRIGHTON', 72, 154);
    g.setLineDash([10, 8]); g.strokeStyle = '#26231f'; g.lineWidth = 2; g.beginPath(); g.moveTo(70, 196); g.lineTo(1490, 196); g.stroke(); g.setLineDash([]);

    g.fillStyle = '#8b97a6'; g.font = `500 22px ${F.m}`; g.fillText('PHOTO', 128, 284);
    g.fillStyle = '#c9a54a'; g.fillRect(48, 450, 92, 72); g.strokeStyle = '#a8852f'; g.lineWidth = 2; g.strokeRect(60, 462, 68, 48);
    g.fillStyle = '#1c1915';
    [['1.', 'GREENER'], ['2.', 'HARRISON JAY'], ['4c.', 'GRAPHIC · WEB · UX/UI'], ['8.', 'MANCHESTER / BRIGHTON']]
      .forEach(([n, t], i) => { g.font = `500 24px ${F.m}`; g.fillStyle = '#6a5f55'; g.fillText(n, 320, 170 + i * 66); g.font = `600 32px ${F.m}`; g.fillStyle = '#1c1915'; g.fillText(t, 380, 170 + i * 66); });
    placeholderTag(g, W2, H2, false); return c;

/* ---------- Cards ---------- */
function makeItemMesh(cfg) {
  const isReceipt = cfg.kind === 'receipt', isPaper = cfg.kind === 'biz';
  const { w, h, t } = cfg;
  const shape = rr(-w / 2, -h / 2, w / 2, h / 2, isReceipt ? 0.06 : isPaper ? 0.12 : 0.32);
  const group = new THREE.Group();
  const bodyGeo = new THREE.ExtrudeGeometry(shape, { depth: t, bevelEnabled: false, curveSegments: 12 });
  bodyGeo.translate(0, 0, -t / 2);
  const body = new THREE.Mesh(bodyGeo, new THREE.MeshStandardMaterial({ color: isReceipt ? 0xf4f2ec : 0xf1eee7, roughness: 0.6 }));
  const surface = isReceipt ? { roughness: 0.92 } : isPaper ? { roughness: 0.62, sheen: 0.3, sheenRoughness: 0.8 } : { roughness: 0.32, clearcoat: 0.55, clearcoatRoughness: 0.22 };
  const frontMat = new THREE.MeshPhysicalMaterial({ map: tex(drawArt(cfg.art, 'front')), ...surface });
  const backMat = new THREE.MeshPhysicalMaterial({ map: tex(drawArt(cfg.art, 'back')), ...surface });
  const fg = faceGeo(shape, w, h);
  const front = new THREE.Mesh(fg, frontMat); front.position.z = t / 2 + 0.0015;
  const back = new THREE.Mesh(fg.clone(), backMat); back.rotation.y = Math.PI; back.position.z = -t / 2 - 0.0015;
  for (const m of [body, front, back]) { m.castShadow = true; m.receiveShadow = true; m.userData.item = cfg; group.add(m); }
  group.rotation.x = -Math.PI / 2; // lie flat, artwork facing up, artwork top toward the top of the wallet
  cfg.frontMat = frontMat; cfg.backMat = backMat;
  return group;
}
// Swap in real artwork later: ITEMS[i].front = 'cards/licence-front.png' and it loads here.
const loader = new THREE.TextureLoader();
function loadArt(cfg) {
  for (const side of ['front', 'back']) {
    if (!cfg[side]) continue;
    loader.load(cfg[side], (t) => { t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = maxAniso; const m = cfg[side + 'Mat']; m.map = t; m.needsUpdate = true; });
  }
}

/* ---------- Build the wallet ---------- */
const wallet = new THREE.Group(); scene.add(wallet);
const pickables = [];
function addPick(mesh, target) { mesh.userData.target = target; pickables.push(mesh); }

// Right panel (stays on the table)
const R_RIGHT = [RAD_SPINE, RAD_OUT, RAD_OUT, RAD_SPINE];
const rightShape = rr(0, -H / 2, W, H / 2, R_RIGHT);
const rightPanel = slab(rightShape, PT, 0); wallet.add(rightPanel); addPick(rightPanel, 'wallet');
const linePath = (x0, z0, x1, z1) => { const p = new THREE.Path(); p.moveTo(x0, -z0); p.lineTo(x1, -z1); return p; };

// Real sizes. Cards stand portrait in their slots (artwork turned on its side), as in the product photo.
for (const cfg of ITEMS) {
  if (cfg.kind === 'receipt') Object.assign(cfg, { w: 15.6, h: 6.8, t: 0.014 });
  else if (cfg.kind === 'biz') Object.assign(cfg, { w: 8.5, h: 5.5, t: 0.045 });
  else Object.assign(cfg, { w: CARD.w, h: CARD.w * 650 / 1004, t: CARD.t });
  cfg.rotated = cfg.kind !== 'receipt';
  cfg.zLen = cfg.rotated ? cfg.w : cfg.h;
  cfg.xLen = cfg.rotated ? cfg.h : cfg.w;
}

// Right side, bottom to top: money slot (runs the full width), lining, the hidden side-slot card,
// the slot backing, seven stepped cards, then the front pocket. Every layer is flush with the edge.
const RIGHT_STRIP = 1.0; // strip by the fold where the side-slot card peeks out
let y = PT + 0.002;
const receiptCfg = ITEMS.find((i) => i.kind === 'receipt');
receiptCfg.home = { parent: 'right', y: y + 0.007, x: 0, zTop: -H / 2 - 0.8 };
y += 0.016;
const lining = slab(rightShape, LAYER, y); wallet.add(lining); addPick(lining, 'wallet');
y += LAYER + 0.002;
const liningTop = y;
const sideCfg = ITEMS.find((i) => i.slot === 'side');
sideCfg.home = { parent: 'right', y: y + sideCfg.t / 2, x: 0.35 + sideCfg.xLen / 2, zTop: -4.6 };
y += sideCfg.t + 0.002;
const backing = slab(rr(RIGHT_STRIP, -H / 2, W, H / 2, [0.06, RAD_OUT, RAD_OUT, 0.06]), LAYER, y);
wallet.add(backing); addPick(backing, 'wallet');
y += LAYER + 0.002;
const backingTop = y;
const stagger = ITEMS.filter((i) => typeof i.slot === 'number').sort((a, b) => a.slot - b.slot);
stagger.forEach((cfg, k) => {
  cfg.home = { parent: 'right', y: y + cfg.t / 2, x: 5.35, zTop: -5.85 + k * 0.52 };
  y += cfg.t + 0.002;
});
const POCKET_EDGE = -1.9;
const pocket = slab(rr(RIGHT_STRIP, -H / 2, W, -POCKET_EDGE, [0.06, RAD_OUT, 0.04, 0.04]), LAYER, y);
wallet.add(pocket); addPick(pocket, stagger[stagger.length - 1]);
const pocketTop = y + LAYER;
y += LAYER + 0.003;
const rightStack = y - PT;
const rightTopAt = (x, z) => (x < RIGHT_STRIP + 0.05 ? liningTop : z >= POCKET_EDGE ? pocketTop : backingTop);
const rightStitch = rr(0.22, -H / 2 + 0.22, W - 0.22, H / 2 - 0.22, [0.04, RAD_OUT - 0.2, RAD_OUT - 0.2, 0.04]);
wallet.add(
  stitches(rightStitch, rightTopAt), stitches(rightStitch, () => 0, true),
  stitches(linePath(RIGHT_STRIP + 0.2, -H / 2 + 0.3, RIGHT_STRIP + 0.2, POCKET_EDGE), () => backingTop),
  stitches(linePath(RIGHT_STRIP + 0.2, POCKET_EDGE + 0.15, RIGHT_STRIP + 0.2, H / 2 - 0.3), () => pocketTop),
);

// Left panel on a hinge at the fold. Pivot height lets it close flat over both stacks.
const licenceCfg = ITEMS.find((i) => i.id === 'licence');
const LEFT_STRIP = 1.2;
const leftStack = 0.016 + LAYER + 0.002 + CARD.t + 0.003 + LAYER;
const HP = PT + (rightStack + leftStack) / 2 + 0.015;
const leftPivot = new THREE.Group(); leftPivot.position.set(0, HP, 0); wallet.add(leftPivot);
const leftContent = new THREE.Group(); leftContent.position.set(0, -HP, 0); leftPivot.add(leftContent);
const R_LEFT = [RAD_OUT, RAD_SPINE, RAD_SPINE, RAD_OUT];
const leftShape = rr(-W, -H / 2, 0, H / 2, R_LEFT);
const leftPanel = slab(leftShape, PT, 0); leftContent.add(leftPanel); addPick(leftPanel, 'wallet');
const lLiningY = PT + 0.018;
const leftLining = slab(leftShape, LAYER, lLiningY); leftContent.add(leftLining); addPick(leftLining, 'wallet');
const lLiningTop = lLiningY + LAYER + 0.002;

// ID window: the licence stands portrait and fills the window, like the card in the photo.
const winX = -5.15, winZ = 0.15, holeW = 5.1, holeL = 8.3;
licenceCfg.home = { parent: 'left', y: lLiningTop + CARD.t / 2, x: winX, zTop: winZ - licenceCfg.zLen / 2 };
const frameY = lLiningTop + CARD.t + 0.003;
const frameShape = rr(-W, -H / 2, -LEFT_STRIP, H / 2, [RAD_OUT, 0.06, 0.06, RAD_OUT]);
frameShape.holes.push(rr(winX - holeW / 2, -(winZ + holeL / 2), winX + holeW / 2, -(winZ - holeL / 2), 0.3, THREE.Path));
const winFrame = slab(frameShape, LAYER, frameY); leftContent.add(winFrame); addPick(winFrame, licenceCfg);
const frameTop = frameY + LAYER;
const leftStitch = rr(-W + 0.22, -H / 2 + 0.22, -0.22, H / 2 - 0.22, [RAD_OUT - 0.2, 0.04, 0.04, RAD_OUT - 0.2]);
leftContent.add(
  stitches(leftStitch, (x) => (x < -LEFT_STRIP - 0.05 ? frameTop : lLiningTop)), stitches(leftStitch, () => 0, true),
  stitches(linePath(-LEFT_STRIP - 0.2, -H / 2 + 0.3, -LEFT_STRIP - 0.2, H / 2 - 0.3), () => frameTop),
  stitches(rr(winX - holeW / 2 - 0.24, -(winZ + holeL / 2 + 0.24), winX + holeW / 2 + 0.24, -(winZ - holeL / 2 - 0.24), 0.5), () => frameTop),
);
const pane = new THREE.Mesh(new THREE.PlaneGeometry(holeW, holeL), paneMat);
pane.rotation.x = -Math.PI / 2; pane.position.set(winX, frameY + LAYER * 0.5, winZ); pane.renderOrder = 2; leftContent.add(pane);

// Spine: an arc of leather that appears as the wallet folds.
let spine = null;
function updateSpine(theta) {
  if (spine) { wallet.remove(spine); spine.geometry.dispose(); pickables.splice(pickables.indexOf(spine), 1); spine = null; }
  if (theta > -0.01) return;
  const s = new THREE.Shape();
  const a0 = -Math.PI / 2, a1 = -Math.PI / 2 + theta;
  s.absarc(0, HP, HP, a0, a1, true);
  s.absarc(0, HP, HP - PT, a1, a0, false);
  const depth = H - 0.2;
  const g = new THREE.ExtrudeGeometry(s, { depth, bevelEnabled: false, curveSegments: 24 });
  g.translate(0, 0, -depth / 2);
  spine = new THREE.Mesh(g, [edgeMat, leatherMat]); spine.castShadow = true; spine.receiveShadow = true;
  wallet.add(spine); addPick(spine, 'wallet');
}

// Items into their homes
for (const cfg of ITEMS) {
  const g = makeItemMesh(cfg);
  const h = cfg.home;
  const parent = h.parent === 'left' ? leftContent : wallet;
  if (cfg.rotated) g.rotation.set(-Math.PI / 2, 0, -Math.PI / 2); // artwork turned on its side, as in the photo
  g.position.set(h.x, h.y, h.zTop + cfg.zLen / 2);
  cfg.group = g; cfg.parent = parent;
  cfg.homePos = g.position.clone(); cfg.homeQuat = g.quaternion.clone();
  cfg.hover = 0;
  parent.add(g);
  g.traverse((m) => { if (m.isMesh) pickables.push(m); });
  loadArt(cfg);
}

// The money slot runs through the fold. While the wallet folds, hide the half that would pass through the cover.
renderer.localClippingEnabled = true;
const foldClip = [new THREE.Plane(new THREE.Vector3(1, 0, 0), 0)];
let receiptClipped = null;
function clipReceipt(on) {
  if (receiptClipped === on) return; receiptClipped = on;
  receiptCfg.group.traverse((m) => { if (m.isMesh) { m.material.clippingPlanes = on ? foldClip : null; m.material.clipShadows = true; m.material.needsUpdate = true; } });
}

/* ---------- Backdrop that dims the table while an item is out ---------- */
const backdrop = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.MeshBasicMaterial({ color: 0x15110d, transparent: true, opacity: 0, depthWrite: false }));
backdrop.position.z = -19; camera.add(backdrop);

/* ---------- State ---------- */
const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
let openVal = 0, openTarget = 0, pendingItem = null;
let active = null;          // { item, p, dir, homePos, homeQuat, dist }
let yaw = 0, yawT = 0, pitch = 0, pitchT = 0;
const tmpQ = new THREE.Quaternion(), tmpE = new THREE.Euler();
const closedTarget = new THREE.Vector3(W / 2, 0, 0), openTargetV = new THREE.Vector3(0, 0, 0);

function applyOpen() {
  const e = ease(openVal);
  const theta = -Math.PI * (1 - e);
  leftPivot.rotation.z = theta;
  clipReceipt(openVal < 0.999);
  updateSpine(theta);
  const tgt = closedTarget.clone().lerp(openTargetV, e);
  const delta = tgt.sub(controls.target);
  controls.target.add(delta); camera.position.add(delta);
}
function setOpen(v) {
  if (active) return;
  openTarget = v ? 1 : 0; updateUI();
}

function expandedPose(cfg) {
  const D = 14;
  const visH = 2 * D * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  const visW = visH * camera.aspect;
  const mobile = innerWidth <= 720;
  const s = Math.min((mobile ? 0.4 : 0.56) * visH / cfg.h, (mobile ? 0.86 : 0.5) * visW / cfg.w);
  const q = camera.quaternion;
  const pos = camera.position.clone()
    .addScaledVector(new THREE.Vector3(0, 0, -1).applyQuaternion(q), D)
    .addScaledVector(new THREE.Vector3(1, 0, 0).applyQuaternion(q), mobile ? 0 : -0.15 * visW)
    .addScaledVector(new THREE.Vector3(0, 1, 0).applyQuaternion(q), mobile ? 0.2 * visH : 0);
  const quat = q.clone().multiply(tmpQ.setFromEuler(tmpE.set(pitch, yaw, 0)));
  return { pos, quat, scale: s };
}

function pull(cfg) {
  if (active) return;
  if (openVal < 1) { pendingItem = cfg; setOpen(true); return; }
  cfg.hover = 0; cfg.group.position.copy(cfg.homePos); cfg.group.quaternion.copy(cfg.homeQuat);
  cfg.group.updateMatrixWorld(true);
  const homePos = new THREE.Vector3(), homeQuat = new THREE.Quaternion();
  cfg.group.getWorldPosition(homePos); cfg.group.getWorldQuaternion(homeQuat);
  const bottomZ = homePos.z + cfg.zLen / 2;
  const dist = bottomZ + H / 2 + 0.6;
  scene.attach(cfg.group);
  yaw = yawT = 0; pitch = pitchT = 0;
  active = { item: cfg, p: 0, dir: 1, homePos, homeQuat, dist };
  controls.enabled = false;
  setHover(null);
  updateUI();
}
function putBack() {
  if (!active || active.dir === -1) return;
  active.dir = -1; yawT = 0; pitchT = 0;
  hideSheet(); updateUI();
}
function poseActive() {
  const { item, p, homePos, homeQuat, dist } = active; const g = item.group;
  const slideEnd = homePos.clone().addScaledVector(SLIDE_DIR, dist);
  if (p <= 1) {
    const f = ease(p);
    g.position.copy(homePos).addScaledVector(SLIDE_DIR, dist * f);
    g.quaternion.copy(homeQuat); g.scale.setScalar(1);
  } else {
    const f = ease(p - 1); const t = expandedPose(item);
    g.position.lerpVectors(slideEnd, t.pos, f); g.position.y += Math.sin(Math.PI * f) * 2.2;
    g.quaternion.slerpQuaternions(homeQuat, t.quat, f);
    g.scale.setScalar(1 + (t.scale - 1) * f);
  }
  backdrop.material.opacity = Math.max(0, Math.min(1, p - 1)) * 0.45;
}
function finishReturn() {
  const cfg = active.item;
  cfg.parent.attach(cfg.group);
  cfg.group.position.copy(cfg.homePos); cfg.group.quaternion.copy(cfg.homeQuat); cfg.group.scale.setScalar(1);
  active = null; backdrop.material.opacity = 0; controls.enabled = true; updateUI();
}

/* ---------- Sheet + UI ---------- */
const sheet = $('#sheet');
function showSheet(cfg) {
  $('#sheetEyebrow').textContent = cfg.eyebrow;
  $('#sheetTitle').textContent = cfg.title;
  $('#sheetBody').textContent = cfg.body;
  const facts = $('#sheetFacts'); facts.replaceChildren();
  for (const [k, v] of cfg.facts) { const dt = document.createElement('dt'); dt.textContent = k; const dd = document.createElement('dd'); dd.textContent = v; facts.append(dt, dd); }
  facts.hidden = cfg.facts.length === 0;
  $('#sheetNote').textContent = cfg.front ? '' : 'Placeholder artwork. The real design drops in here.';
  sheet.classList.add('open'); sheet.setAttribute('aria-hidden', 'false');
  $('#flipBtn').focus({ preventScroll: true });
}
function hideSheet() { sheet.classList.remove('open'); sheet.setAttribute('aria-hidden', 'true'); }

const hint = $('#hint'), openBtn = $('#openBtn');
const chips = [];
for (const cfg of ITEMS) {
  const b = document.createElement('button');
  b.className = 'btn chip'; b.type = 'button'; b.textContent = cfg.label; b.setAttribute('aria-pressed', 'false');
  b.addEventListener('click', () => { if (active && active.item === cfg) putBack(); else if (!active) pull(cfg); });
  $('#inventory').append(b); chips.push([cfg, b]);
}
function updateUI() {
  const isOpen = openTarget === 1;
  openBtn.textContent = isOpen ? 'Close wallet' : 'Open wallet';
  openBtn.disabled = !!active;
  for (const [cfg, b] of chips) { b.setAttribute('aria-pressed', String(!!active && active.item === cfg)); b.disabled = !!active && active.item !== cfg; }
  hint.textContent = active ? 'Drag to turn it · Esc or click outside to put it back'
    : isOpen ? 'Pick something to pull it out · drag to look around' : 'Click the wallet to open it';
}
openBtn.addEventListener('click', () => setOpen(openTarget !== 1));
$('#resetBtn').addEventListener('click', () => { if (!active) fitCamera(); });
$('#flipBtn').addEventListener('click', () => { yawT += Math.PI; });
$('#backBtn').addEventListener('click', putBack);
addEventListener('keydown', (e) => { if (e.key === 'Escape') putBack(); });

/* ---------- Pointer: pick, hover, drag to turn ---------- */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
function pick(ev) {
  const r = renderer.domElement.getBoundingClientRect();
  ndc.set(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObjects(pickables, false)[0];
  if (!hit) return null;
  return hit.object.userData.item || hit.object.userData.target || null;
}
let hovered = null;
function setHover(cfg) { hovered = cfg; renderer.domElement.style.cursor = cfg ? 'pointer' : ''; }
let down = null, dragging = false;
const el = renderer.domElement;
el.addEventListener('pointerdown', (e) => {
  down = { x: e.clientX, y: e.clientY, lx: e.clientX, ly: e.clientY };
  if (active && active.p >= 2) { dragging = true; el.setPointerCapture(e.pointerId); }
});
el.addEventListener('pointermove', (e) => {
  if (dragging && down) {
    yawT += (e.clientX - down.lx) * 0.009; pitchT = Math.max(-0.9, Math.min(0.9, pitchT + (e.clientY - down.ly) * 0.009));
    down.lx = e.clientX; down.ly = e.clientY; el.style.cursor = 'grabbing'; return;
  }
  if (active || e.pointerType === 'touch') return;
  const t = pick(e);
  if (openVal < 1) { setHover(t === 'wallet' || (t && t.id) ? 'wallet' : null); return; }
  setHover(t && t.id ? t : null);
});
el.addEventListener('pointerup', (e) => {
  const moved = down ? Math.hypot(e.clientX - down.x, e.clientY - down.y) : 99;
  const wasDragging = dragging; dragging = false; el.style.cursor = '';
  down = null;
  if (moved > 6) return;
  if (active) { if (active.p >= 2) { const t = pick(e); if (!(t && t === active.item)) putBack(); } return; }
  const t = pick(e);
  if (!t) return;
  if (openVal < 1 || openTarget === 0) { setOpen(true); return; }
  if (t.id) pull(t);
});

/* ---------- Loop ---------- */
const clock = new THREE.Clock();
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05);
  if (openVal !== openTarget) {
    const step = dt / (0.95 * SPEED);
    openVal = openTarget > openVal ? Math.min(openTarget, openVal + step) : Math.max(openTarget, openVal - step);
    applyOpen();
    if (openVal === 1 && pendingItem) { const c = pendingItem; pendingItem = null; pull(c); }
  }
  // Hover nudge: the card rises slightly out of its slot.
  for (const cfg of ITEMS) {
    if (active && active.item === cfg) continue;
    const target = (!active && openVal === 1 && hovered === cfg) ? 1 : 0;
    cfg.hover += (target - cfg.hover) * Math.min(1, dt * 12);
    cfg.group.position.set(cfg.homePos.x, cfg.homePos.y, cfg.homePos.z - cfg.hover * 0.7);
  }
  if (active) {
    const rate = active.p < 1 || (active.p === 1 && active.dir < 0) ? 1 / (0.5 * SPEED) : 1 / (0.75 * SPEED);
    const before = active.p;
    active.p = Math.max(0, Math.min(2, active.p + active.dir * dt * rate));
    yaw += (yawT - yaw) * Math.min(1, dt * 8); pitch += (pitchT - pitch) * Math.min(1, dt * 8);
    poseActive();
    if (active.dir === 1 && before < 2 && active.p === 2) showSheet(active.item);
    if (active.dir === -1 && active.p === 0) finishReturn();
  }
  if (controls.enabled) controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ---------- Start ---------- */
controls.target.copy(closedTarget);
applyOpen();
fitCamera();
updateUI();
await Promise.race([
  Promise.all([document.fonts.load(`700 40px ${F.d}`), document.fonts.load(`500 20px ${F.m}`), document.fonts.load(`600 20px ${F.m}`)]),
  new Promise((r) => setTimeout(r, 2500)),
]).catch(() => {});
// Redraw placeholder art now that the fonts are in.
for (const cfg of ITEMS) {
  if (!cfg.front) { cfg.frontMat.map = tex(drawArt(cfg.art, 'front')); cfg.frontMat.needsUpdate = true; }
  if (!cfg.back) { cfg.backMat.map = tex(drawArt(cfg.art, 'back')); cfg.backMat.needsUpdate = true; }
}
window.__walletReady = true;
requestAnimationFrame(frame);
setTimeout(() => $('#veil').classList.add('gone'), 150);
</script>
