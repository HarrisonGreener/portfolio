<meta charset="utf-8">
<title>Wallet CV</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: full-bleed 3D tabletop; quiet HUD pinned to the corners; an item sheet slides in when something is pulled out. */
:root{
  --table:#E3E3E0;      /* very light grey ground */
  --paper:#F2F2F0;      /* very light grey in place of white */
  --ink:#1F1F1F;        /* very dark grey in place of black */
  --ink-soft:#5C5C59;
  --line:rgba(31,31,31,.14);
  --green:#73956F;      /* Greener logo green */
  --accent:#46663F;     /* the same green, deepened for text and focus rings */
  --display:'Archivo','Helvetica Neue',Arial,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--table);color:var(--ink);font-family:var(--display);overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#stage{position:fixed;inset:0}
#stage canvas{display:block;touch-action:none;outline:none}
.vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(120% 90% at 50% 45%,transparent 55%,rgba(31,31,31,.14) 100%)}

.brand{position:fixed;z-index:3;top:calc(env(safe-area-inset-top,0px) + 20px);left:calc(max(16px,env(safe-area-inset-left,0px)) + 8px);pointer-events:none}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft)}
.brand .logo{display:block;width:clamp(150px,18vw,220px);height:auto;margin:8px 0 0;color:var(--green);transition:color .4s ease}
body.item-out .brand .logo{color:var(--ink)}   /* black while an item is out over the dimmed desk */
.brand p{margin:8px 0 0;font-size:14px;font-stretch:110%;color:var(--ink-soft)}

.hint{position:fixed;z-index:3;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 86px);
  font-family:var(--mono);font-size:12px;letter-spacing:.04em;color:var(--ink);background:rgba(242,242,240,.85);
  border:1px solid var(--line);padding:8px 14px;border-radius:999px;white-space:nowrap;pointer-events:none;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:opacity .3s}

.bar{position:fixed;z-index:3;left:0;right:0;bottom:0;display:flex;gap:12px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;
  padding-left:calc(max(16px,env(safe-area-inset-left,0px)) + 8px);padding-right:calc(max(16px,env(safe-area-inset-right,0px)) + 8px);
  padding-block:0 calc(env(safe-area-inset-bottom,0px) + 20px);pointer-events:none}
.inventory{display:flex;flex-wrap:wrap;gap:6px;align-items:center;pointer-events:auto;min-width:0}
.inventory .label{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);margin-right:4px}
.controls{display:flex;gap:8px;pointer-events:auto}
.btn{font-family:var(--mono);font-size:12px;font-weight:500;letter-spacing:.05em;color:var(--ink);background:var(--paper);
  border:1px solid var(--line);border-radius:999px;padding:9px 14px;cursor:pointer;transition:background .2s,transform .15s}
.btn:hover{background:#FAFAF8}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.primary:hover{background:#2E2E2E}
.chip{padding:7px 11px;font-size:11.5px}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}

.sheet{position:fixed;z-index:4;right:calc(max(16px,env(safe-area-inset-right,0px)) + 12px);top:50%;width:min(340px,calc(100vw - 48px));
  transform:translate(16px,-50%);opacity:0;pointer-events:none;background:var(--paper);border:1px solid var(--line);border-radius:18px;
  padding:22px 22px 18px;box-shadow:0 24px 60px -24px rgba(31,31,31,.4);transition:opacity .35s,transform .35s;display:flex;flex-direction:column;gap:14px}
.sheet.open{opacity:1;transform:translate(0,-50%);pointer-events:auto}
.sheet h2{margin:0;font-size:26px;font-stretch:115%;font-weight:800;line-height:1.1;letter-spacing:-.01em;text-wrap:balance}
.sheet .body{margin:0;font-size:15px;line-height:1.5;color:var(--ink);max-width:60ch}
.facts{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13.5px;border-top:1px solid var(--line);padding-top:12px}
.facts dt{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);padding-top:2px}
.facts dd{margin:0;min-width:0}
.note{font-family:var(--mono);font-size:11px;color:var(--ink-soft);margin:0}
.sheet .actions{display:flex;gap:8px;flex-wrap:wrap}

.veil{position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:var(--table);transition:opacity .6s}
.veil.gone{opacity:0;pointer-events:none}
.veil p{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);text-align:center;max-width:40ch;line-height:1.6}

@media (max-width:720px){
  .hint{bottom:auto;top:calc(env(safe-area-inset-top,0px) + 96px);font-size:11px}
  .sheet{top:auto;bottom:0;left:0;right:0;width:auto;border-radius:18px 18px 0 0;max-height:46vh;overflow:auto;
    transform:translateY(24px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 18px);
    padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
  .sheet.open{transform:translateY(0)}
  .inventory .label{display:none}
  .bar{flex-direction:column;align-items:stretch}
  .inventory{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .inventory .chip{flex:none}
  .controls{justify-content:flex-end}
}
@media (prefers-reduced-motion:reduce){ .sheet,.hint,.veil{transition:none} }
.tag{position:fixed;left:0;top:0;z-index:5;pointer-events:none;opacity:0;transition:opacity .18s ease}
.tag.on{opacity:1}
.tag-line{position:absolute;left:-.5px;bottom:0;width:1px;background:#1F1F1F;transform-origin:bottom;transform:scaleY(0);transition:transform .22s cubic-bezier(.2,.7,.2,1)}
.tag.on .tag-line{transform:scaleY(1)}
.tag-dot{position:absolute;left:-3px;bottom:-3px;width:6px;height:6px;border-radius:50%;background:#1F1F1F;box-shadow:0 0 0 2px #F2F2F0}
.tag-text{position:absolute;left:0;transform:translate(-50%,4px);white-space:nowrap;transition:transform .22s cubic-bezier(.2,.7,.2,1);
  font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-weight:700;font-size:15px;letter-spacing:-.025em;line-height:1;color:#1F1F1F}
.tag.on .tag-text{transform:translate(-50%,0)}
.tag.down .tag-line{bottom:auto;top:0;transform-origin:top}
.tag.down .tag-dot{bottom:auto;top:-3px}
@media (prefers-reduced-motion:reduce){.tag,.tag-line,.tag-text{transition:none}}
/* Harry's own hands, pixelated, as the cursor: pointing by default, grab over anything you can pick up */
:root{--hand-point:image-set(url("assets/cursor/hand-point.png") 1x,url("assets/cursor/hand-point@2x.png") 2x) 9 1,url("assets/cursor/hand-point.png") 9 1,auto;
  --hand-grab:image-set(url("assets/cursor/hand-grab.png") 1x,url("assets/cursor/hand-grab@2x.png") 2x) 9 8,url("assets/cursor/hand-grab.png") 9 8,grab}
html,body,canvas{cursor:var(--hand-point)}
canvas.can-grab{cursor:var(--hand-grab)}
.phone-ui{position:fixed;z-index:6;overflow:hidden;color:#F2F2F0;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;letter-spacing:-.02em;
  background:radial-gradient(120% 70% at 75% 18%,rgba(115,149,111,.45),rgba(115,149,111,0) 60%),linear-gradient(#2a2a2a,#141414);
  opacity:0;pointer-events:none;transition:opacity .25s ease}
.phone-ui.on{opacity:1;pointer-events:auto}
.phone-ui:not(.on),.phone-ui:not(.on) *{pointer-events:none!important}   /* hidden screen must never catch clicks */
.pu-status{position:absolute;inset:0 0 auto;height:2.6em;display:flex;align-items:center;justify-content:space-between;padding:0 1.5em;font-weight:600;font-size:.8em;z-index:3}
.pu-pill{position:absolute;left:50%;top:.55em;width:6.2em;height:1.7em;margin-left:-3.1em;border-radius:1em;background:#000}
.pu-icons{display:flex;gap:.35em;align-items:center}.pu-icons svg{height:.8em;fill:currentColor}
.pu-screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;transition:opacity .35s ease,transform .45s cubic-bezier(.2,.7,.2,1);opacity:0;transform:translateY(4%);pointer-events:none}
.phone-ui[data-step=lock] .pu-lock,.phone-ui[data-step=pass] .pu-pass,.phone-ui[data-step=chat] .pu-chat{opacity:1;transform:none;pointer-events:auto}
.phone-ui[data-step=chat] .pu-pass{transform:translateY(-12%)}
.pu-lock{padding-top:4.2em;text-align:center}
.pu-date{font-size:.95em;font-weight:500;opacity:.85}
.pu-bigtime{font-size:4.4em;font-weight:700;line-height:1;margin-top:.1em}
.pu-swipe{margin-top:auto;margin-bottom:1.6em;font-size:.8em;opacity:.75;display:flex;flex-direction:column;align-items:center;gap:.2em}
.pu-arrow{font-size:1.3em;line-height:.6;animation:pu-nudge 1.1s ease-in-out infinite}
.pu-homebar{position:absolute;bottom:.7em;left:50%;width:7em;height:.3em;margin-left:-3.5em;border-radius:.2em;background:#F2F2F0;opacity:.85;animation:pu-nudge 1.1s ease-in-out infinite}
@keyframes pu-nudge{0%,100%{transform:translateY(0)}50%{transform:translateY(-.45em)}}
.phone-ui[data-step=pass] .pu-lock,.phone-ui[data-step=chat] .pu-lock{transform:translateY(-100%);opacity:0;transition:transform .7s cubic-bezier(.5,0,.2,1),opacity .7s ease}
.phone-ui[data-step=swipe] .pu-lock{opacity:1;transform:translateY(-6%)}
.phone-ui[data-step=swipe] .pu-homebar{animation:none;transform:translateY(-2.2em);transition:transform .35s ease}
.phone-ui[data-step=swipe] .pu-swipe{opacity:0;transition:opacity .2s ease}
.pu-pass{padding-top:4.4em;background:rgba(20,20,20,.55);backdrop-filter:blur(10px)}
.pu-pass-title{font-size:1em;font-weight:500}
.pu-dots{display:flex;gap:.9em;margin:1.1em 0 2em}
.pu-dots i{width:.75em;height:.75em;border-radius:50%;border:1.5px solid #F2F2F0;transition:background .12s}
.pu-dots i.on{background:#F2F2F0}
.pu-keys{display:grid;grid-template-columns:repeat(3,3.9em);gap:.9em 1.4em;justify-items:center}
.pu-keys b{width:3.9em;height:3.9em;border-radius:50%;background:rgba(242,242,240,.16);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:1em;font-weight:400;transition:background .12s}
.pu-keys b small{font-size:.42em;letter-spacing:.12em;font-weight:600;margin-top:.1em;opacity:.8}
.pu-keys b.hit{background:rgba(242,242,240,.55)}
.pu-chat{padding-top:2.6em;background:#1F1F1F;align-items:stretch}
.pu-head{display:grid;grid-template-columns:2.4em 1fr 2.4em;align-items:center;padding:.3em .6em .7em;border-bottom:1px solid rgba(242,242,240,.1)}
.pu-back{background:none;border:0;color:#73956F;font:inherit;font-size:1.8em;line-height:1;cursor:pointer;padding:0}
.pu-who{display:flex;flex-direction:column;align-items:center;gap:.3em;font-size:.78em}
.pu-avatar{width:2.6em;height:2.6em;border-radius:50%;background:#73956F;display:grid;place-items:center;font-weight:700;font-size:1.2em}
.pu-thread{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:.4em;padding:.9em .8em}
.pu-stamp{align-self:center;font-size:.68em;opacity:.5;margin-bottom:.3em}
.pu-msg{margin:0;max-width:80%;padding:.55em .8em;border-radius:1.1em;font-size:.9em;line-height:1.3}
.pu-msg.them{align-self:flex-start;background:#2f2f2f;border-bottom-left-radius:.35em}
.pu-msg.me{align-self:flex-end;background:#73956F;border-bottom-right-radius:.35em}
.pu-compose{display:flex;flex-direction:column;gap:.45em;padding:.6em .7em .8em;border-top:1px solid rgba(242,242,240,.1)}
.pu-row{display:flex;gap:.45em}
.pu-compose input,.pu-compose textarea{flex:1;min-width:0;font:inherit;font-size:.85em;color:#F2F2F0;background:#2a2a2a;border:1px solid transparent;border-radius:1.2em;padding:.55em .8em;outline:none;resize:none}
.pu-compose input:focus,.pu-compose textarea:focus{border-color:#73956F}
.pu-compose ::placeholder{color:rgba(242,242,240,.4)}
.pu-send-row{align-items:flex-end}
.pu-send{flex:none;width:2.2em;height:2.2em;border-radius:50%;border:0;background:#73956F;color:#F2F2F0;font:inherit;font-weight:700;cursor:pointer}
.pu-back:focus-visible,.pu-send:focus-visible{outline:2px solid #F2F2F0;outline-offset:2px}
.pu-note{margin:0;font-size:.62em;text-align:center;opacity:.45}
@media (prefers-reduced-motion:reduce){.phone-ui,.pu-screen,.pu-dots i,.pu-keys b{transition:none}.pu-arrow,.pu-homebar{animation:none}}
</style>
