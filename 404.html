<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Page not found · Harrison Greener</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<style>
@font-face{font-family:Archivo;src:url("/cv/fonts/Archivo.ttf") format("truetype");font-weight:100 900;font-stretch:62% 125%}
@font-face{font-family:Hibble;src:url("/projects/hibble/fonts/Hibble-Regular.woff") format("woff")}
:root{--ink:#1F1F1F;--paper:#F2F2F0;--green:#73956F}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--green);color:var(--ink);font:400 18px/1.5 Archivo,Arial,sans-serif;padding:24px}
main{max-width:560px}
img{height:28px;width:auto;display:block;margin-bottom:48px}
h1{font-stretch:112%;font-weight:800;font-size:clamp(64px,14vw,140px);line-height:.9;letter-spacing:-.04em;margin:0}
.note{font-family:Hibble,cursive;font-size:clamp(28px,5vw,40px);line-height:1.2;margin:18px 0 0;transform:rotate(-2deg)}
p{margin:18px 0 0;font-size:19px}
a.b{display:inline-block;margin-top:28px;font-weight:700;text-decoration:none;background:var(--ink);color:var(--paper);padding:13px 22px;border-radius:999px}
</style>
<script>
/* Visitor stats (GoatCounter, no cookies). Only counts on the live domain; add #toggle-goatcounter to a URL to stop counting your own visits */
(function(){var on=location.hostname==='harrisongreener.co.uk';
window.gc=function(p,t){try{if(on&&window.goatcounter&&goatcounter.count)goatcounter.count({path:p,title:t||p,event:true})}catch(e){}};
if(!on)return;var s=document.createElement('script');s.async=true;s.src='https://gc.zgo.at/count.js';s.setAttribute('data-goatcounter','https://harrygreener.goatcounter.com/count');document.head.appendChild(s);
document.addEventListener('click',function(e){var a=e.target.closest&&e.target.closest('a[href]');if(!a)return;var u;try{u=new URL(a.href,location.href)}catch(x){return}
if(/\.(pdf|zip)$/i.test(u.pathname))gc('download'+u.pathname);else if(u.protocol==='mailto:')gc('contact/email');else if(/^https?:$/.test(u.protocol)&&u.hostname!==location.hostname)gc('out/'+u.hostname+u.pathname.replace(/\/$/,''))},true)})();
</script>
</head>
<body>
<main>
  <a href="/" aria-label="Harrison Greener, home"><img src="/brand/greener-solid-black.svg" alt="Greener"></a>

</main>
